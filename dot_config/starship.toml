# ─────────────────────────────────────────────────────────────
#  Starship prompt — ~/.config/starship.toml
#  Two lines: context on top, a clean input caret below.
# ─────────────────────────────────────────────────────────────

format = """
$directory\
$git_branch$git_status\
$kubernetes\
$terraform\
$nodejs$python$golang$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Only shows when you're actually pointed at a cluster — critical safety signal.
[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold blue"
format = '[$symbol$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"          # production clusters light up red

[terraform]
symbol = "󱁢 "
style = "bold 105"
format = "[$symbol$workspace]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "
detect_files = ["package.json"]

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version)]($style) "

# These three need an explicit `format`. Without one they use starship's default,
# which is "via $symbol$version" — that's where the stray "via  via" came from.
[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold red"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true
# Don't announce "orbstack" on every prompt — it's the default context and never
# changes. Only show it when a project actually pins a different one.
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml"]
disabled = true

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
