# kind cluster: 1 control-plane + 2 workers.
# Ports 80/443 are mapped to the host so an Ingress actually works from your browser.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
