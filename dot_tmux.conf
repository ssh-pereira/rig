# ─────────────────────────────────────────────────────────────
#  ~/.tmux.conf — Hugo
#  Prefix is Ctrl-a.  Press it, release, then press the key.
# ─────────────────────────────────────────────────────────────

# ---------- Prefix ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # double-tap Ctrl-a to send a literal Ctrl-a to the shell

# ---------- Core behaviour ----------
set -g mouse on               # click panes, drag borders, scroll with the wheel
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on    # closing window 2 renumbers 3 -> 2
set -g history-limit 100000
set -g escape-time 0          # no delay after pressing Esc
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off  # closing a session drops you into another, not out of tmux
set -g display-time 2000

# True colour — required for Ghostty / starship / TUIs to look right
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ---------- Reload ----------
bind r source-file ~/.tmux.conf \; display "  config reloaded"

# ---------- Splits (open in the CURRENT directory) ----------
# | and - are the mnemonic pair (| looks like a vertical divider, - horizontal),
# but | needs Shift on most layouts. \ and _ are bound to the same actions as
# unshifted aliases, so you never have to reach for Shift to split.
bind | split-window -h -c "#{pane_current_path}"    # Shift+\  vertical split
bind '\' split-window -h -c "#{pane_current_path}"  # \        same, no Shift
bind - split-window -v -c "#{pane_current_path}"    # -        horizontal split
bind _ split-window -v -c "#{pane_current_path}"    # Shift+-  same
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------- Pane navigation (vim keys, no prefix needed) ----------
# PRIMARY: Ctrl+h/j/k/l — bound by the vim-tmux-navigator plugin at the bottom
# of this file. That's the one to use; it's the de-facto standard.
#
# Trade-off: Ctrl+h is also readline's backspace. The plugin takes it, so use the
# Delete key instead. If you'd rather keep Ctrl+h as backspace, comment out the
# vim-tmux-navigator plugin line and use the Option bindings below.
#
# SECONDARY: Option+h/j/k/l. These require `macos-option-as-alt = true` in the
# Ghostty config AND a full Ghostty restart to take effect — a config reload is
# not enough. Note Cmd+H is macOS "hide application", which is easy to hit by
# mistake while reaching for these.
bind -n M-h select-pane -L    # Option+h
bind -n M-j select-pane -D    # Option+j
bind -n M-k select-pane -U    # Option+k
bind -n M-l select-pane -R    # Option+l

# ---------- Pane resizing (repeatable: hold the key) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z      # zoom / unzoom the current pane to fullscreen

# ---------- Window navigation ----------
bind -n S-Left  previous-window   # Shift+Left
bind -n S-Right next-window       # Shift+Right
bind Tab last-window              # prefix Tab = jump to previous window

# ---------- Session management ----------
# prefix S = session picker in a floating popup, annotated with live CPU, memory
# and Claude context usage per session.
#
# Why not `choose-session -F`: its format is expanded once when the list is
# drawn, and `#(shell)` in tmux is asynchronous — the value arrives on a later
# redraw that never comes for a static list. So the columns stayed blank. An fzf
# popup renders real data immediately and gives us kill/rename keys for free.
# Absolute path on purpose: tmux escapes the "~" here and sh never expands it.
bind S display-popup -E -w 85% -h 70% '/Users/hugo/.local/bin/tmux-sessions'

# Fallback is tmux's own built-in picker on lowercase "s" — that's the stock
# binding and this config never overrides it. Don't put anything on C-s:
# tmux-resurrect claims it for "save session", and plugins load last, so they
# silently win over anything bound here.
bind X kill-session
bind W choose-tree -Zw            # prefix W = tree of every session/window/pane

# prefix N = create a NEW NAMED session without leaving tmux.
# Prompts for a name, creates it, and switches you to it.
# -c starts it in the CURRENT directory instead of $HOME, which is almost always
# what you want when you're spinning up a session for the project you're in.
bind N command-prompt -p "new session name:" "new-session -c '#{pane_current_path}' -s '%%'"

# prefix R = rename the CURRENT session (fixes the "0", "3", "4" clutter)
bind R command-prompt -I "#S" -p "rename session to:" "rename-session '%%'"

# ---------- Copy mode (vi keys) ----------
setw -g mode-keys vi
bind v copy-mode                                    # prefix v = enter scroll/copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ---------- Word-movement passthrough (kept from your old config) ----------
bind -n M-Left send-keys M-b
bind -n M-Right send-keys M-f
bind -n M-BSpace send-keys M-BSpace

# ═════════════════════════════════════════════════════════════
#  AI AGENT LAYOUTS
# ═════════════════════════════════════════════════════════════

# prefix A — split the window into 3 panes and start an agent in each.
# Use this to run three tasks in parallel and watch them all at once.
bind A \
  split-window -h -c "#{pane_current_path}" \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-layout main-vertical \; \
  select-pane -t 1

# prefix C — classic pair: Claude Code on the left, a free shell on the right.
bind C \
  split-window -h -p 40 -c "#{pane_current_path}" \; \
  select-pane -t 1 \; \
  send-keys "claude" C-m

# prefix G — full-window lazygit
bind G new-window -c "#{pane_current_path}" -n git "lazygit"

# prefix Ctrl-k — full-window k9s.
# NOT plain "K": that's already resize-pane -U above, and tmux silently lets a
# later binding overwrite an earlier one, which killed keyboard resize-up.
bind C-k new-window -n k8s "k9s"

# ═════════════════════════════════════════════════════════════
#  STATUS BAR
# ═════════════════════════════════════════════════════════════
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#7f849c"

set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "

set -g status-right-length 100
# load = 1-minute load average. `sysctl -n vm.loadavg` prints "{ 1m 5m 15m }",
# so with cut the 1-minute value is field 2 (field 1 is the literal "{").
# This machine has 16 cores: ~16 means fully busy, under ~8 is comfortable.
set -g status-right "#[fg=#45475a]│ #[fg=#a6adc8]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) #[fg=#45475a]│ #[fg=#f9e2af]load #(sysctl -n vm.loadavg | cut -d' ' -f2) #[fg=#45475a]│ #[fg=#89b4fa]%H:%M "

setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# ═════════════════════════════════════════════════════════════
#  PLUGINS  (prefix + I to install, prefix + U to update)
# ═════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # sane defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save every 15 min, auto-restore
set -g @plugin 'tmux-plugins/tmux-yank'          # better clipboard integration
set -g @plugin 'christoomey/vim-tmux-navigator'  # seamless pane nav

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

# ═════════════════════════════════════════════════════════════
#  BACKGROUND STATS COLLECTOR
# ═════════════════════════════════════════════════════════════
# Refreshes ~/.cache/tmux/stats every 3s with per-session CPU, memory and Claude
# context usage, so the ^a S picker can render instantly from a cache instead of
# shelling out per row. The script self-locks, so re-sourcing this config will
# not spawn a second copy, and it exits on its own when the tmux server stops.
run-shell -b '~/.local/bin/tmux-stats --daemon'
